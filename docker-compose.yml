version: '3.8'
services:
  web:
    build: .
    container_name: ecommerce_web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
    restart: always
  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: always
